version: "3.9"

services:

  # ── PostgreSQL with PostGIS ───────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: smartattend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: smartattend-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384m

  # ── Node.js API ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: smartattend-api
    restart: unless-stopped
    environment:
      NODE_ENV:                production
      PORT:                    4000
      DATABASE_URL:            postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL:               redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET:              ${JWT_SECRET}
      JWT_REFRESH_SECRET:      ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN:          15m
      JWT_REFRESH_EXPIRES_IN:  7d
      AI_ENGINE_URL:           http://ai-engine:8000
      INTERNAL_SECRET:         ${INTERNAL_SECRET}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT}
      S3_BUCKET:               ${S3_BUCKET}
      AWS_ACCESS_KEY_ID:       ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY:   ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION:              ${AWS_REGION}
      ALLOWED_ORIGINS:         ${ALLOWED_ORIGINS}
      GEOFENCE_RADIUS_METERS:  200
      FACE_MATCH_THRESHOLD:    0.65
      SCENE_MATCH_THRESHOLD:   0.60
      MAX_VERIFY_ATTEMPTS:     3
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512m
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback

  # ── Python AI Engine ──────────────────────────────────────────────────────
  ai-engine:
    build:
      context: services/ai-engine
      dockerfile: Dockerfile
    container_name: smartattend-ai
    restart: unless-stopped
    environment:
      DEBUG:                 "false"
      DATABASE_URL:          postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL:             redis://:${REDIS_PASSWORD}@redis:6379
      INTERNAL_SECRET:       ${INTERNAL_SECRET}
      API_SERVICE_URL:       http://api:4000
      S3_BUCKET:             ${S3_BUCKET}
      AWS_ACCESS_KEY_ID:     ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION:            ${AWS_REGION}
      INSIGHTFACE_MODEL:     buffalo_l
      INSIGHTFACE_CTX_ID:    -1
      FACE_MATCH_THRESHOLD:  0.65
      SCENE_MATCH_THRESHOLD: 0.60
      SCENE_MIN_SAMPLES:     5
      MODEL_DIR:             /app/models
    volumes:
      - ai_models:/app/models
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s   # model loading takes time
    deploy:
      resources:
        limits:
          memory: 3g       # InsightFace + PyTorch need headroom

  # ── Admin Web (Nginx serving React build) ─────────────────────────────────
  admin-web:
    build:
      context: apps/admin-web
      dockerfile: Dockerfile
    container_name: smartattend-admin
    restart: unless-stopped
    networks: [frontend]
    deploy:
      resources:
        limits:
          memory: 128m

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: smartattend-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - admin-web
    networks: [frontend]
    deploy:
      resources:
        limits:
          memory: 128m

networks:
  backend:
    driver: bridge
    internal: true          # AI engine and DB never exposed to internet
  frontend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ai_models:
  nginx_logs: